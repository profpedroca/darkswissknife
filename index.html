<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dark Swiss Knife</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        h1 { margin-top: 50px; font-size: 28px; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }
        .menu { margin-top: 50px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .btn { background-color: #1a1a1a; color: #fff; padding: 20px; border-radius: 12px; text-decoration: none; text-align: center; font-size: 18px; border: 1px solid #333; transition: 0.2s; }
        .btn:active { background-color: #333; }
    </style>
</head>
<body>
    <h1>Dark Swiss Knife</h1>
    
    <div class="menu">
        <a href="payment/index.html" class="btn">Simulador de Pagamento</a>
        </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("Service Worker Registrado!"));
        }
    </script>
</body>
</html>
